; DL2 Head Tracking Configuration
; Delete this file to reset to defaults

[Network]
; UDP port for OpenTrack data (default: 4242)
UDPPort=4242

[Sensitivity]
; Rotation sensitivity multipliers (1.0 = 1:1)
YawMultiplier=1.0
PitchMultiplier=1.0
RollMultiplier=1.0

[Position]
; Position tracking sensitivity (0.1-10.0, higher = more movement)
SensitivityX=2.0
SensitivityY=2.0
SensitivityZ=2.0
; Position limits in meters (how far the camera can move)
LimitX=0.30
LimitY=0.20
LimitZ=0.40
; Backward lean limit (prevents camera clipping through player model)
LimitZBack=0.10
; Invert position axes, for a tracker whose axis runs the other way.
InvertX=false
InvertY=false
; InvertZ is for a tracker that sends depth backwards, not for a lean that
; feels reversed. It is applied before the LimitZ / LimitZBack clamp, so
; turning it on also swaps the travel budgets to 0.10m forward and 0.40m back.
InvertZ=false
; Enable/disable position tracking (6DOF)
Enabled=true

[Smoothing]
; Smoothing is chosen per connection from the tracker's source address
; and covers rotation and position. 0.0 = none, 1.0 = heavy.
; LocalSmoothing: tracker running on this machine (loopback)
LocalSmoothing=0.0
; RemoteSmoothing: tracker on a remote network device, e.g. a phone
RemoteSmoothing=0.15

[Hotkeys]
; Virtual key codes (hex). Every action also has a Ctrl+Shift+<letter>
; chord fallback (see README).
ToggleKey=0x23    ; End - Enable/disable head tracking
TrackingModeKey=0x21 ; Page Up - Cycle tracking mode (normal / rotation only / position only)
YawModeKey=0x22   ; Page Down - Toggle yaw mode (camera-local / world-locked)
ReticleToggleKey=0x2d  ; Insert - Toggle reticle

[Rotation]
; Yaw rotation frame.
;   true  = world-locked (default) - yaw rotates around world-up; horizon stays level.
;   false = camera-local - yaw rotates around head-up; pitched-down
;          yaw sweeps a cone and tilts the horizon.
WorldLockedYaw=true

[Reticle]
; Show the head tracking reticle overlay
Enabled=true

[General]
; Auto-enable tracking on game start
AutoEnable=true
; Show on-screen notifications
ShowNotifications=true
